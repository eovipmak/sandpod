openapi: 3.0.3
info:
  title: SandPod Panel API (mechanism only)
  version: 4.0.0
  description: |
    Thin wrap over the sandpodctl binary (modules/sandpodctl). No policy (domains, quotas,
    billing, TLS, DNS). Sync ops <5s return directly; long ops return
    202 + jobId, poll GET /v1/jobs/{id}. Script exit 0->2xx, 2->400, 1->500.
    Async endpoints return 409 when the instance is busy or the global job
    cap (10 queued/running) is reached; bodies over 1 MiB return 413.
servers:
  - url: http://127.0.0.1:8741/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Daemon liveness (no script call)
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /customers:
    get:
      summary: List customers (from customers.tsv registry)
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Customer' }
    post:
      summary: Provision customer (async, wraps sandpodctl provision-customer)
      parameters:
        - { name: dry_run, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProvisionRequest' }
      responses:
        '202':
          description: queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadArgs' }
        '409': { description: 'instance busy or global job cap (10) reached' }
        '413': { description: 'body over 1 MiB' }
  /customers/{id}/sites:
    get:
      summary: List sites (wraps sandpodctl list-sites --json)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9]{3}$' } }
      responses:
        '200':
          description: 'ok (Spec v2 shape: defaults/php_sites/port_apps)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteList' }
    post:
      summary: Add PHP site (wraps sandpodctl add-site)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: dry_run, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddSiteRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadArgs' }
        '500': { $ref: '#/components/responses/RuntimeFail' }
  /customers/{id}/sites/{domain}:
    patch:
      summary: Set PHP version (wraps sandpodctl set-php-version)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: domain, in: path, required: true, schema: { type: string } }
        - { name: dry_run, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [php]
              properties:
                php: { type: string, enum: ['8.2', '8.3', '8.4', '8.5', '8.6'] }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadArgs' }
    delete:
      summary: Remove site (wraps sandpodctl remove-site; ?delete_data=true appends --delete-data, query only, no body)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: domain, in: path, required: true, schema: { type: string } }
        - { name: delete_data, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: dry_run, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadArgs' }
  /customers/{id}:
    delete:
      summary: Remove customer (async, wraps sandpodctl remove-customer; query flags, no body)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9]{3}$' } }
        - { name: delete_data, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: delete_user, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: delete_registry_entry, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: dry_run, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '202': { description: queued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '400': { $ref: '#/components/responses/BadArgs' }
        '409': { description: 'instance busy or global job cap reached' }
  /customers/{id}/port-apps:
    post:
      summary: Add port app (wraps sandpodctl add-port-app; panel allocates port 3000-3999)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: dry_run, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddPortAppRequest' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadArgs' }
  /customers/{id}/port-apps/{domain}:
    delete:
      summary: Remove port app (wraps sandpodctl remove-port-app; ?delete_data=true appends --delete-data, query only, no body)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: domain, in: path, required: true, schema: { type: string } }
        - { name: delete_data, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: dry_run, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadArgs' }
  /customers/{id}/reload:
    post:
      summary: Reload FPM minor or port app (wraps reload-customer-php / reload-customer-app)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: dry_run, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target:
                  type: string
                  description: 'php-8.3 | app-<domain>'
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
  /customers/{id}/resources:
    get:
      summary: Resource report (wraps sandpodctl resource-report --json)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object } } } }
  /customers/{id}/ssh-keys:
    post:
      summary: Add SSH key (wraps sandpodctl add-ssh-key; panel owns who gets access)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: dry_run, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicKey]
              properties:
                publicKey: { type: string, description: 'ssh-ed25519/rsa/ecdsa/dss <base64> [comment], single line, max 4095 chars' }
      responses:
        '202': { description: queued (async job, wraps sandpodctl add-ssh-key), content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '409': { description: 'instance busy or global job cap reached (fix-forward, re-run after)' }
  /customers/{id}/backups:
    post:
      summary: Backup customer (async, wraps sandpodctl backup-customer)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: dry_run, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '202': { description: queued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '409': { description: 'instance busy or global job cap reached (fix-forward, re-run after)' }
  /dbs:
    post:
      summary: Create site DB (async, wraps sandpodctl create-site-db; creds returned once, never stored)
      parameters:
        - { name: dry_run, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dbName, dbUser]
              properties:
                dbName: { type: string, pattern: '^[A-Za-z0-9_]+$', maxLength: 64 }
                dbUser: { type: string, pattern: '^[A-Za-z0-9_]+$', maxLength: 64 }
      responses:
        '202': { description: queued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '400': { $ref: '#/components/responses/BadArgs' }
        '409': { description: 'instance busy or global job cap reached (fix-forward, re-run after)' }
        '413': { description: 'body over 1 MiB' }
  /host-nginx/reload:
    post:
      summary: Regen + reload host nginx in ONE job (chain sandpodctl generate-site-conf then sandpodctl reload-host-nginx; 409 if busy)
      parameters:
        - { name: dry_run, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '202': { description: queued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '409': { description: 'instance busy or global job cap reached (fix-forward, re-run after)' }
  /rollouts/php:
    post:
      summary: Fleet PHP patch rollout (async, wraps sandpodctl rollout-php-patch)
      parameters:
        - { name: dry_run, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolloutRequest' }
      responses:
        '202': { description: queued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '409': { description: 'instance busy or global job cap reached (fix-forward, re-run after)' }
  /rollouts/app:
    post:
      summary: Fleet Node/Python rollout (async, wraps sandpodctl rollout-app-patch)
      parameters:
        - { name: dry_run, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolloutRequest' }
      responses:
        '202': { description: queued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '409': { description: 'instance busy or global job cap reached (fix-forward, re-run after)' }
  /jobs:
    get:
      summary: List job summaries (no stdout — creds only via get(jobId))
      responses:
        '200': { description: ok }
  /jobs/{jobId}:
    get:
      summary: Poll async job
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '404': { description: unknown job }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT-or-opaque-token }
  responses:
    BadArgs: { description: 'script exit 2 (bad input)' }
    RuntimeFail: { description: 'script exit 1 (runtime failure, .bak rollback attempted)' }
  schemas:
    Health: { type: object, properties: { ok: { type: boolean }, version: { type: string } } }
    Customer:
      type: object
      properties:
        instance: { type: string }
        serviceUser: { type: string }
        container: { type: string }
        webPort: { type: integer }
        sshPort: { type: integer }
        image: { type: string }
    ProvisionRequest:
      type: object
      required: [instance]
      properties:
        instance: { type: string, pattern: '^[0-9]{3}$' }
        serviceUser: { type: string }
        webPort: { type: integer }
        sshPort: { type: integer }
        image: { type: string }
        quotaGb: { type: integer, default: 10 }
        cpus: { type: string, default: '1.0' }
        memory: { type: string, default: '1g' }
        ioWeight: { type: integer, default: 100 }
    AddSiteRequest:
      type: object
      required: [domain]
      properties:
        domain: { type: string }
        php: { type: string, enum: ['8.2', '8.3', '8.4', '8.5', '8.6'], default: '8.3' }
        primary: { type: boolean, default: false }
    AddPortAppRequest:
      type: object
      required: [domain, port, command]
      properties:
        domain: { type: string }
        port: { type: integer, minimum: 3000, maximum: 3999 }
        command: { type: string }
        primary: { type: boolean, default: false }
    SiteList:
      type: object
      properties:
        defaults: { type: object }
        php_sites: { type: array, items: { type: object } }
        port_apps: { type: array, items: { type: object } }
    RolloutRequest:
      type: object
      properties:
        batchSize: { type: integer, default: 5 }
        sleepSeconds: { type: integer, default: 10 }
        skipUpdate: { type: boolean, default: false }
    Job:
      type: object
      properties:
        jobId: { type: string }
        status: { type: string, enum: [queued, running, done, failed] }
        exitCode: { type: integer, nullable: true }
        stdout: { type: string }
        stderr: { type: string }
    Ok:
      type: object
      properties:
        ok: { type: boolean }
        stdout: { type: string }
        stderr: { type: string }
        warnings: { type: array, items: { type: string } }
        requestId: { type: string }
