# SandPod journald cap (host, as root).
#
# Customer containers log to stdout/stderr via supervisord; the owning
# user-manager journals collect them via `podman logs`/journald. Without a
# cap a chatty customer can fill /var/log/journal. This drop-in bounds the
# total journal, not per-site content (retention/off-host stays ops policy).
#
# Install:
#   sudo cp modules/monitoring-backup/config/sandpod-journald.conf /etc/systemd/journald.conf.d/sandpod.conf
#   sudo systemctl restart systemd-journald
[Journal]
SystemMaxUse=1G
RuntimeMaxUse=200M
MaxFileSec=14day
