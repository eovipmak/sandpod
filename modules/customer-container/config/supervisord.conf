[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700
username=sandpod-controller
password=__SUPERVISOR_PASSWORD__

[supervisorctl]
serverurl=unix:///run/supervisor.sock
username=sandpod-controller
password=__SUPERVISOR_PASSWORD__

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:sshd]
command=/usr/sbin/sshd -D -e
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:crond]
command=/usr/sbin/crond -n
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:php82-fpm]
command=/opt/remi/php82/root/usr/sbin/php-fpm --nodaemonize -c /etc/opt/remi/php82/php.ini -y /etc/sandpod/php-fpm/8.2.conf
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:php83-fpm]
command=/opt/remi/php83/root/usr/sbin/php-fpm --nodaemonize -c /etc/opt/remi/php83/php.ini -y /etc/sandpod/php-fpm/8.3.conf
priority=31
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:php84-fpm]
command=/opt/remi/php84/root/usr/sbin/php-fpm --nodaemonize -c /etc/opt/remi/php84/php.ini -y /etc/sandpod/php-fpm/8.4.conf
priority=32
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:php85-fpm]
command=/opt/remi/php85/root/usr/sbin/php-fpm --nodaemonize -c /etc/opt/remi/php85/php.ini -y /etc/sandpod/php-fpm/8.5.conf
priority=33
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=40
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# Persistent customer port apps (Node/Python) managed by customer-apps scripts.
# Host-side ~/config/supervisor/*.conf files (read-only in the container) each
# define one [program:app-<domain>] section running as `customer`.
[include]
files = /etc/sandpod-config/supervisor/*.conf
