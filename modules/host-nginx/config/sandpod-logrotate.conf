# SandPod host-nginx log rotation. Install (host, as root):
#   cp modules/host-nginx/config/sandpod-logrotate.conf /etc/logrotate.d/sandpod
# Generated per-customer logs: /var/log/nginx/sandpod-*-access.log.
/var/log/nginx/sandpod-*-access.log /var/log/nginx/sandpod-*-error.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        /bin/systemctl reload nginx.service >/dev/null 2>&1 || true
    endscript
}
